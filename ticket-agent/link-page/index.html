<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; form-action https://pass.rw.by; base-uri 'none'">
  <title>Выбор мест · RailScout</title>
  <link rel="stylesheet" href="styles.css">
  <script src="open-ticket.js" defer></script>
</head>
<body>
  <main>
    <h1 id="title">Открываем выбор мест</h1>
    <p id="trip"></p>
    <p id="status" role="status">Сейчас откроется страница вагонов и мест выбранного поезда.</p>
    <form id="booking-form" action="https://pass.rw.by/ru/order/places/" method="post" hidden>
      <input type="hidden" name="route">
      <input type="hidden" name="url">
      <button type="submit">Выбрать места</button>
    </form>
  </main>
</body>
</html>
