<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <aside class="history-panel" aria-label="История чатов">
      <div class="history-header">
        <button id="newChat" class="new-chat-button" type="button"><span aria-hidden="true">+</span> Новый чат</button>
      </div>
      <div class="history-label">ИСТОРИЯ ЧАТОВ</div>
      <nav id="chatHistory" class="chat-history" aria-label="Список чатов"></nav>
      <p class="history-note">Диалоги сохраняются между перезапусками.</p>
      <button id="clearAll" class="compare-button" type="button">Очистить всё</button>
      <button id="compareChats" class="compare-button" type="button">Сравнение ответов</button>
    </aside>
    <section class="chat-panel">
      <header class="topbar"><div><h1 id="chatTitle">Новый чат</h1></div><button id="clearChat" class="ghost-button" title="Очистить диалог">Очистить</button></header>
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="chatForm" class="composer">
        <textarea id="prompt" rows="1" placeholder="Напишите сообщение…" aria-label="Сообщение"></textarea>
        <button id="sendButton" class="send-button" type="submit" aria-label="Отправить"><span>↑</span></button>
      </form>
      <p class="hint">Enter — отправить · Shift + Enter — новая строка</p>
    </section>
    <aside class="settings-panel">
      <div class="settings-title"><span class="settings-icon">⚙</span><div><p class="eyebrow">ПАРАМЕТРЫ</p><h2>Настройки</h2></div></div>
      <label class="field"><span>Модель</span><select id="model">
        <optgroup label="DeepSeek">
          <option value="deepseek-flash" data-provider="deepseek">DeepSeek V4.1 Flash</option>
        </optgroup>
        <optgroup label="OpenRouter — бесплатно">
          <option value="openrouter/free" data-provider="openrouter">Автовыбор бесплатной модели</option>
          <option value="minimax/minimax-m3:free" data-provider="openrouter">MiniMax M3 (free)</option>
        </optgroup>
        <optgroup label="Gemini 3.5">
          <option value="gemini-3.5-flash-lite" data-provider="gemini">Gemini 3.5 Flash-Lite</option>
          <option value="gemini-3.5-flash" data-provider="gemini">Gemini 3.5 Flash</option>
        </optgroup>
      </select></label>
      <label class="field format-field" for="jsonMode">
        <div class="field-heading"><span>JSON-формат ответа</span><span class="format-control"><output id="jsonModeStatus">Выключен</output><span class="switch"><input id="jsonMode" type="checkbox" aria-label="Отвечать в JSON-формате" /><span class="switch-track" aria-hidden="true"></span></span></span></div>
        <small>JSON-формат: модель вернёт только корректный JSON без пояснений.</small>
      </label>
    </aside>
  </main>
  <div id="comparisonModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="comparisonTitle">
    <div class="modal-card">
      <div class="modal-header"><div><p class="eyebrow">АНАЛИЗ МОДЕЛИ</p><h2 id="comparisonTitle">Сравнение ответов</h2></div><button id="closeComparison" class="modal-close" type="button" aria-label="Закрыть">×</button></div>
      <div id="comparisonResult" class="comparison-result" aria-live="polite"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
