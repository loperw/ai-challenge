<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <aside class="history-panel" aria-label="История чатов">
      <div class="history-header">
        <button id="newChat" class="new-chat-button" type="button"><span aria-hidden="true">+</span> Новый чат</button>
      </div>
      <div class="history-label">ИСТОРИЯ ЧАТОВ</div>
      <nav id="chatHistory" class="chat-history" aria-label="Список чатов"></nav>
      <p class="history-note">Диалоги хранятся до закрытия вкладки.</p>
      <button id="compareChats" class="compare-button" type="button">Сравнение ответов</button>
    </aside>
    <section class="chat-panel">
      <header class="topbar"><div><h1 id="chatTitle">Новый чат</h1></div><button id="clearChat" class="ghost-button" title="Очистить диалог">Очистить</button></header>
      <div id="messages" class="messages" aria-live="polite"></div>
      <p id="requestTemperature" class="request-temperature" hidden></p>
      <form id="chatForm" class="composer">
        <textarea id="prompt" rows="1" placeholder="Напишите сообщение…" aria-label="Сообщение"></textarea>
        <button id="sendButton" class="send-button" type="submit" aria-label="Отправить"><span>↑</span></button>
      </form>
      <p class="hint">Enter — отправить · Shift + Enter — новая строка</p>
    </section>
    <aside class="settings-panel">
      <div class="settings-title"><span class="settings-icon">⚙</span><div><p class="eyebrow">ПАРАМЕТРЫ</p><h2>Настройки</h2></div></div>
      <label class="field"><span>Модель</span><select id="model"><option value="deepseek-v4-flash">deepseek-v4-flash</option><option value="deepseek-v4-pro">deepseek-v4-pro</option><option value="deepseek-v4-flash-vision-exp">deepseek-v4-flash-vision-exp</option></select></label>
      <label class="field"><span>Температура <output id="temperatureValue">1.0</output></span><input id="temperature" type="range" min="0" max="2" value="1" step="0.1" aria-describedby="temperatureHint" /><div class="range-labels"><small>Точнее</small><small>Креативнее</small></div><small id="temperatureHint">Для моделей DeepSeek: от 0 до 2.</small></label>
      <label class="field format-field" for="jsonMode">
        <div class="field-heading"><span>JSON-формат ответа</span><span class="format-control"><output id="jsonModeStatus">Выключен</output><span class="switch"><input id="jsonMode" type="checkbox" aria-label="Отвечать в JSON-формате" /><span class="switch-track" aria-hidden="true"></span></span></span></div>
        <small>JSON-формат: модель вернёт только корректный JSON без пояснений.</small>
      </label>
      <label class="field"><span>Количество токенов</span><input id="maxTokens" type="number" min="1" max="384000" step="1" placeholder="Например, 500" inputmode="numeric" /><small>Максимальная длина каждого ответа. Оставьте пустым, чтобы не задавать лимит.</small></label>
      <label class="field"><span>Условие завершения (stop sequence)</span><input id="stopSequence" type="text" placeholder="Например, ###" /><small>Ответ остановится перед этой последовательностью. Оставьте пустым, чтобы не задавать условие.</small></label>
    </aside>
  </main>
  <div id="comparisonModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="comparisonTitle">
    <div class="modal-card">
      <div class="modal-header"><div><p class="eyebrow">АНАЛИЗ МОДЕЛИ</p><h2 id="comparisonTitle">Сравнение ответов</h2></div><button id="closeComparison" class="modal-close" type="button" aria-label="Закрыть">×</button></div>
      <div id="comparisonResult" class="comparison-result" aria-live="polite"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
